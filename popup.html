<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>WebSurf Helper</title>
  <style>
    :root {
      --bg: #151e25;
      --border: #2c5253;
      --selected: #346c7b;
      --text: #83b7c5;
      --accent: #f07156;
    }
    body {
      margin: 0;
      padding: 16px;
      width: 220px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-align: center;
    }
    .switch { display: flex; border: 1px solid var(--border); }
    .switch button {
      flex: 1;
      padding: 8px 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .switch button + button { border-left: 1px solid var(--border); }
    .switch button[aria-pressed="true"] { background: var(--selected); color: #fff; }
    .switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .state { margin: 10px 0 0; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>WebSurf Helper</h1>
  <div class="switch" role="group" aria-label="拡張機能の有効・無効">
    <button type="button" id="on">オン</button>
    <button type="button" id="off">オフ</button>
  </div>
  <p class="state" id="state"></p>
  <script src="popup.js"></script>
</body>
</html>
